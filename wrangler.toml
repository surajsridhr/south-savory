# Cloudflare Worker for South Savory. Deployed by Workers Builds on every push to main
# (deploy command: npx wrangler deploy, root directory: /).
name = "south-savory"
main = "site/src/worker.js"
compatibility_date = "2025-09-01"

[assets]
directory = "./site/public"
binding = "ASSETS"
run_worker_first = true      # the password check runs before any file is served

[[d1_databases]]
binding = "DB"
database_name = "south-savory"
database_id = "ed65dd58-1c8b-4d79-aefa-eaac0967929e"   # created 24 Oct 2026, APAC
