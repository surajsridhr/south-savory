    '</main>';
  dock('<button class="btn primary" '+(blocked||clash||!chosen.length?'disabled':'')+' onclick="saveLunch()">'+(ev?"Save menu":"Save menu · "+plural(chosen.length,"dish","dishes"))+'</button>');
  tabbar("home");
}
/* a dish with no price yet: the price typed here goes into the menu list for good,
   whether or not the dish is on this day's menu. A dish that already has a list price
   keeps it; a price changed on a picked dish is for that day only. */
var listFilled={};
function fillListPrice(id,v,unticked){
  var it=S.menus.lunch.filter(function(i){return i.id===id;})[0]; if(!it) return;
  if(it.price!=null&&!listFilled[id]) return;
  var n=num(v); it.price=n; listFilled[id]=n!=null; save();
  if(unticked&&n!=null) clearTimeout(fillListPrice.t), fillListPrice.t=setTimeout(function(){ toast(it.name+" saved at "+rupee(n)+" in the menu list"); },900);
}
function untickAll(){ draft.sel={}; draft.combos.forEach(function(c){ c.dishes=[]; }); render(); }
function clearLunch(id){
  var ev=S.events[id]; if(!ev) return;
  if(ev.orders.length&&!confirm("Clear "+relLower(ev.date)+"'s menu? Its "+plural(ev.orders.length,"order")+" will be removed too.")) return;
  delete S.events[id]; save(); draft=null; go("#/lunch?d="+ev.date);
  toast(relDate(ev.date)+"'s menu cleared",function(){ S.events[id]=ev; save(); render(); });
}
function filterDishes(v){
  var q=normName(v);
  document.querySelectorAll(".sgroup").forEach(function(g){
    var any=false;
    g.querySelectorAll(".pick[data-name]").forEach(function(r){ var show=!q||r.getAttribute("data-name").indexOf(q)>=0; r.style.display=show?"":"none"; if(show) any=true; });
    g.style.display=any?"":"none";
  });
}
function lsToggle(id,on){ if(on) draft.sel[id]=true; else { delete draft.sel[id]; draft.combos.forEach(function(c){ c.dishes=c.dishes.filter(function(x){return x!==id;}); }); } render(); }
function comboDish(ix,id,on){ var c=draft.combos[ix]; c.dishes=c.dishes.filter(function(x){return x!==id;}); if(on) c.dishes.push(id); }
function saveLunch(){
  var ev=lunchOn(draft.forDate), d=draft.date;
  var items=S.menus.lunch.filter(function(i){return draft.sel[i.id];}).map(function(i){ var p=draft.price[i.id]!==undefined?draft.price[i.id]:i.price; return {id:i.id,name:i.name,group:i.group,price:p}; });
  items.sort(function(a,b){ return LUNCH_GROUPS.indexOf(a.group)-LUNCH_GROUPS.indexOf(b.group); });
  var combos=draft.combos.filter(function(c){return c.dishes.length;});
  if(ev){
    var keep={}; items.forEach(function(i){keep[i.id]=1;}); combos.forEach(function(c){keep["combo:"+c.id]=1;});
    var dropped=ev.orders.some(function(o){return o.lines.some(function(l){return !keep[l.ref];});});
    if(dropped&&!confirm("Some orders include a dish or combo you removed. Those lines will stop counting. Save anyway?")) return;
    ev.items=items; ev.combos=combos; ev.date=d;
  } else {
    ev={id:uid(),kind:"lunch",date:d,status:"open",items:items,combos:combos,orders:[],createdAt:Date.now()};
    S.events[ev.id]=ev;
  }
  save(); draft=null; go("#/lunch?d="+d); toast("Menu saved");
}

/* ======================= BATTER ======================= */
function viewBatterList(){
  var bs=liveBatches();
  $app.innerHTML=bar("Batter","#/",'<a class="act" href="#/menu/batter">Menu list</a>')+'<main class="page">'+
    '<div class="section" style="margin-top:8px"><h2>Open batches</h2>'+(bs.length?'<div class="list">'+bs.map(function(b){
      var kg=0; kitchenCount(b).forEach(function(c){kg+=c.q;});
      return '<a class="row" href="#/batter/'+b.id+'"><span class="grow"><span class="t1" style="display:block">'+relDate(b.date)+(relDate(b.date)!==fmtDate(b.date)?" · "+fmtDate(b.date):"")+'</span><span class="t2" style="display:block">'+esc(b.items.map(function(i){return i.name;}).join(", "))+'</span></span><span class="val num" style="text-align:right"><span style="display:block;font-weight:500">'+fmtKg(kg)+'</span><span class="t2" style="display:block">'+plural(b.orders.length,"order")+'</span></span>'+I.chev+'</a>';
    }).join("")+'</div>':'<p class="empty">No batch open. Start one when you post the batter menu.</p>')+'</div>'+
    '<p class="foot">Closed batches are in History.</p></main>';
  dock('<a class="btn primary" href="#/batter/setup">New batch</a>');
  tabbar("home");
}
function viewBatterSetup(q){
  var ev=q.id?S.events[q.id]:null;
  var key="batter:"+(q.id||"new");
  if(!draft||draft.key!==key){
    draft={key:key,kind:"batter",date:ev?ev.date:addDays(todayKey(),2),sel:{},rate:{},top:{}};
    if(ev) ev.items.forEach(function(it){ draft.sel[it.id]=true; draft.rate[it.id]=it.rate; draft.top[it.id]=it.topping; });
  }
  var items=S.menus.batter.slice().sort(function(a,b){return a.name.localeCompare(b.name);});
  var chosen=items.filter(function(i){return draft.sel[i.id];});
  $app.innerHTML=bar(ev?"Edit batch":"New batch",ev?"#/batter/"+ev.id:"#/batter")+'<main class="page">'+
    '<div class="field"><label class="f" for="bdate">Pickup date</label><input type="date" id="bdate" value="'+draft.date+'" onchange="draft.date=this.value"></div>'+
    '<div class="section"><h2>Items<span class="aside">rate per kg</span></h2><div class="list">'+items.map(function(it){
      var on=!!draft.sel[it.id];
      return '<div class="pick" style="flex-wrap:wrap"><label class="check grow" style="min-height:0;padding:0"><input type="checkbox" '+(on?'checked':'')+' onchange="bsToggle(\''+it.id+'\',this.checked)"><span class="grow"><span class="nm">'+esc(it.name)+'</span><span class="meta" style="display:block">'+lastPostedText("batter",it)+'</span></span></label>'+
        (on?'<span class="money-in"><input type="number" inputmode="numeric" aria-label="Rate per kg for '+esc(it.name)+'" value="'+(draft.rate[it.id]==null?"":draft.rate[it.id])+'" oninput="draft.rate[\''+it.id+'\']=num(this.value)"></span>':'<span class="val muted num">'+(it.rate==null?"No price":rupee(it.rate)+"/kg")+'</span>')+
        (on&&it.topping!=null?'<div style="width:100%;display:flex;align-items:center;gap:10px;padding:6px 0 0 34px"><span class="small muted grow">Topping, per kilo started</span><span class="money-in"><input type="number" inputmode="numeric" aria-label="Topping price per kilo" value="'+(draft.top[it.id]==null?"":draft.top[it.id])+'" oninput="draft.top[\''+it.id+'\']=num(this.value)"></span></div>':'')+'</div>';
    }).join("")+'</div><button class="btn secondary block" onclick="newItemSheet(\'batter\',true)">New batter item</button></div>'+
    (ev?deleteEventSection(ev):'')+'</main>';
  dock('<button class="btn primary" '+(!chosen.length||!draft.date?'disabled':'')+' onclick="saveBatter()">'+(ev?"Save batch":"Start batch")+'</button>');
  tabbar("home");
}
function bsToggle(id,on){ var it=S.menus.batter.filter(function(i){return i.id===id;})[0]; if(on){ draft.sel[id]=true; if(draft.rate[id]===undefined) draft.rate[id]=it.rate; if(draft.top[id]===undefined) draft.top[id]=it.topping; } else delete draft.sel[id]; render(); }
function saveBatter(){
  var ev=draft.key!=="batter:new"?S.events[draft.key.split(":")[1]]:null;
  var items=S.menus.batter.filter(function(i){return draft.sel[i.id];}).map(function(i){ return {id:i.id,name:i.name,rate:draft.rate[i.id],topping:i.topping==null?null:draft.top[i.id]}; });
  if(ev){ ev.items=items; ev.date=draft.date; }
  else { ev={id:uid(),kind:"batter",date:draft.date,status:"open",items:items,orders:[],createdAt:Date.now()}; S.events[ev.id]=ev; }
  save(); draft=null; go("#/batter/"+ev.id); toast("Batch saved");
}

/* event screen for batter and drops */
function viewEvent(id,backHash){
  var ev=S.events[id]; if(!ev) return go(backHash);
  var closed=ev.status==="closed";
  var title=ev.kind==="batter"?"Batter":(ev.title||"Drop");
  var editHref=ev.kind==="batter"?"#/batter/setup?id="+ev.id:"#/drops/setup?id="+ev.id;
  $app.innerHTML=bar(title,closed?"#/history":backHash)+'<main class="page">'+
    '<div style="display:flex;align-items:baseline;gap:8px;margin-top:6px"><h2 class="title">'+(ev.kind==="batter"?"Pickup ":"Collect ")+relLower(ev.date)+'</h2>'+(closed?'<span class="pill">Closed</span>':'')+'<a class="btn text" style="margin-left:auto" href="'+editHref+'">Edit</a></div>'+
    '<p class="sub">'+fmtDate(ev.date)+(ev.imported?' · brought in from the old app':'')+'</p>'+
    eventBody(ev)+
    '<div class="section">'+(closed?'<button class="btn secondary" onclick="setClosed(\''+ev.id+'\',false)">Reopen</button>':'')+'</div></main>';
  dock(closed?'':'<button class="btn secondary" onclick="setClosed(\''+ev.id+'\',true)">Close '+(ev.kind==="batter"?"batch":"drop")+'</button><button class="btn primary" onclick="openOrder(\''+ev.id+'\')">Add order</button>');
  tabbar(closed?"history":"home");
}
function setClosed(id,on){
  var ev=S.events[id]; if(!ev) return;
  ev.status=on?"closed":"open"; save();
  if(on){ go(ev.kind==="batter"?"#/batter":"#/drops"); toast((ev.kind==="batter"?"Batch":"Drop")+" closed. It's in History.",function(){ ev.status="open"; save(); go(evRoute(ev)); }); }
  else { render(); toast("Reopened"); }
}

/* deleting a batch or drop takes its orders with it, unpaid ones included; undo brings it all back */
function deleteEventSection(ev){
  var what=ev.kind==="batter"?"batch":"drop";
  return '<div class="section"><button class="btn danger" onclick="deleteEvent(\''+ev.id+'\')">Delete this '+what+'</button><p class="hint">'+
    (ev.orders.length?'Removes it and its '+plural(ev.orders.length,"order")+', paid or not.':'Removes it. It has no orders.')+'</p></div>';
}
function deleteEvent(id){
  var ev=S.events[id]; if(!ev) return;
  var what=ev.kind==="batter"?"batch":"drop", unpaid=ev.orders.filter(function(o){return !o.paid;}).length;
  if(ev.orders.length&&!confirm("Delete this "+what+"? Its "+plural(ev.orders.length,"order")+" will be removed too"+(unpaid?", including "+unpaid+" unpaid":"")+".")) return;
  delete S.events[id]; save(); draft=null; go(ev.kind==="batter"?"#/batter":"#/drops");
  toast((ev.kind==="batter"?"Batch":"Drop")+" deleted",function(){ S.events[id]=ev; save(); go(evRoute(ev)); });
}

/* ======================= DROPS ======================= */
function viewDropList(){
  var ds=liveDrops(), byD={};
  ds.forEach(function(d){ (byD[d.date]=byD[d.date]||[]).push(d); });
  var dates=Object.keys(byD).sort();
  $app.innerHTML=bar("Special drops","#/",'<a class="act" href="#/menu/drops">Menu list</a>')+'<main class="page">'+
    (dates.length?dates.map(function(dt){
      var list=byD[dt], n=list.reduce(function(a,d){return a+d.orders.length;},0);
      return '<div class="section" style="margin-top:20px"><h2>Collect '+relLower(dt)+(relDate(dt)!==fmtDate(dt)?' <span class="muted" style="font-weight:400">'+fmtDate(dt)+'</span>':'')+
        (list.length>1?'<a class="aside" href="#/drops/date/'+dt+'" style="color:var(--text);text-decoration:underline;text-underline-offset:3px">All '+n+' together</a>':'')+'</h2><div class="list">'+list.map(function(d){
        return '<a class="row" href="#/drops/'+d.id+'"><span class="grow"><span class="t1" style="display:block">'+esc(d.title)+'</span><span class="t2" style="display:block">'+esc(d.items.map(function(i){return i.name;}).join(", "))+'</span></span><span class="val num" style="text-align:right"><span style="display:block;font-weight:500">'+plural(d.orders.length,"order")+'</span><span class="t2" style="display:block">'+rupee(eventStats(d).total)+'</span></span>'+I.chev+'</a>';
      }).join("")+'</div></div>';
    }).join(""):'<div class="section" style="margin-top:8px"><p class="empty">No drop open. Start one for a festival, ragi malt, lehya or anything else.</p></div>')+
    '<p class="foot">Closed drops are in History.</p></main>';
  dock('<a class="btn primary" href="#/drops/setup">New drop</a>');
  tabbar("home");
}
function viewCollections(dt){
  var list=events("drop").filter(function(d){return d.date===dt;}).sort(byDate);
  var rows=[]; list.forEach(function(ev){ ev.orders.forEach(function(o){ rows.push({ev:ev,o:o}); }); });
  rows.sort(function(a,b){ return normName(a.o.name)<normName(b.o.name)?-1:1; });
  $app.innerHTML=bar("Collect "+fmtDate(dt),"#/drops")+'<main class="page"><p class="sub">'+list.length+' drops · '+rows.length+' orders, by name</p>'+
    '<div class="section">'+(rows.length?'<div class="list">'+rows.map(function(r){ return orderRow(r.ev,r.o).replace('<span class="tag">','<span class="tag">'+esc(r.ev.title)+' · '); }).join("")+'</div>':'<p class="empty">No orders for this day yet.</p>')+'</div></main>';
  tabbar("home");
}
function viewDropSetup(q){
  var ev=q.id?S.events[q.id]:null;
  var key="drop:"+(q.id||"new");
  if(!draft||draft.key!==key){
    draft={key:key,kind:"drop",title:ev?ev.title:"",date:ev?ev.date:addDays(todayKey(),3),items:ev?JSON.parse(JSON.stringify(ev.items)):[]};
  }
  var inDrop={}; draft.items.forEach(function(i){inDrop[i.id]=1;});
  var list=S.menus.drops.slice().sort(function(a,b){return a.name.localeCompare(b.name);});
  $app.innerHTML=bar(ev?"Edit drop":"New drop",ev?"#/drops/"+ev.id:"#/drops")+'<main class="page">'+
    '<div class="field"><label class="f" for="dtitle">Name</label><input type="text" id="dtitle" placeholder="Deepavali, ragi malt, lehya…" value="'+esc(draft.title)+'" oninput="draft.title=this.value;dropDockState()"></div>'+
    '<div class="field"><label class="f" for="ddate">Collection date</label><input type="date" id="ddate" value="'+draft.date+'" onchange="draft.date=this.value"></div>'+
    '<div class="section"><h2>In this drop<span class="aside num">'+draft.items.length+'</span></h2>'+
      (draft.items.length?'<div class="list">'+draft.items.map(function(it,ix){
        return '<div class="pick" style="flex-wrap:wrap"><span class="grow"><span class="nm">'+esc(it.name)+'</span></span><button class="x" aria-label="Remove '+esc(it.name)+'" onclick="draft.items.splice('+ix+',1);render()">'+I.x+'</button>'+
          '<div style="width:100%;display:flex;gap:8px;align-items:center"><select aria-label="Sold" style="flex:1;height:38px" onchange="draft.items['+ix+'].unit=this.value;render()">'+["kg","piece","portion"].map(function(u){return '<option value="'+u+'" '+(it.unit===u?'selected':'')+'>'+UNIT_LABEL[u]+'</option>';}).join("")+'</select>'+
          '<span class="money-in"><input type="number" inputmode="numeric" aria-label="Price" value="'+(it.rate==null?"":it.rate)+'" placeholder="—" oninput="draft.items['+ix+'].rate=num(this.value)"></span>'+
          '</div>'+(it.unit!=="kg"?'<div style="width:100%;display:flex;gap:8px;align-items:center;justify-content:flex-end;padding-top:8px"><span class="small muted">Price for 2 (optional)</span><span class="money-in"><input type="number" inputmode="numeric" aria-label="Price for 2" value="'+(it.pair==null?"":it.pair)+'" placeholder="—" oninput="draft.items['+ix+'].pair=num(this.value)"></span></div>':'')+'</div>';
      }).join("")+'</div>':'<p class="empty">Pick from the drops list below, or add a one-off.</p>')+'</div>'+
    '<div class="section"><h2>From the drops list</h2><div class="list">'+list.filter(function(i){return !inDrop[i.id];}).map(function(it){
      return '<button class="row" onclick="addDropItem(\''+it.id+'\')"><span class="grow"><span class="t1" style="display:block">'+esc(it.name)+'</span><span class="t2" style="display:block">'+priceDesc(it)+'</span></span><span class="small" style="font-weight:500">Add</span></button>';
    }).join("")+'</div><button class="btn secondary block" onclick="newItemSheet(\'drops\',true)">One-off item</button></div>'+
    (ev?deleteEventSection(ev):'')+'</main>';
  dock('<button class="btn primary" id="dropSave" onclick="saveDrop()">'+(ev?"Save drop":"Start drop")+'</button>');
  dropDockState(); tabbar("home");
}
function dropDockState(){ var b=document.getElementById("dropSave"); if(b) b.disabled=!(draft.title.trim()&&draft.items.length&&draft.date); }
function addDropItem(id){ var it=S.menus.drops.filter(function(i){return i.id===id;})[0]; draft.items.push({id:it.id,name:it.name,unit:it.unit,rate:it.rate,pair:it.pair||null}); render(); }
function saveDrop(){
  var ev=draft.key!=="drop:new"?S.events[draft.key.split(":")[1]]:null;
  if(ev){ ev.title=draft.title.trim(); ev.date=draft.date; ev.items=draft.items; }
  else { ev={id:uid(),kind:"drop",title:draft.title.trim(),date:draft.date,status:"open",items:draft.items,orders:[],createdAt:Date.now()}; S.events[ev.id]=ev; }
  save(); draft=null; go("#/drops/"+ev.id); toast("Drop saved");
}

/* ======================= CUSTOM ======================= */
function viewCustomList(){
  var t=todayKey(), up=upcomingCustom();
  $app.innerHTML=bar("Custom orders","#/")+'<main class="page">'+
    '<div class="section" style="margin-top:8px"><h2>Coming up</h2>'+(up.length?'<div class="list">'+up.map(function(ev){
      var o=ev.orders[0]||{lines:[]};
      return '<a class="row" href="#/custom/'+ev.id+'"><span class="grow"><span class="t1" style="display:block">'+esc(o.name||"No name")+'</span><span class="t2" style="display:block">'+relDate(ev.date)+(relDate(ev.date)!==fmtDate(ev.date)?" · "+fmtDate(ev.date):"")+' · '+esc(orderWhat(ev,o))+'</span></span><span class="amt num">'+rupee(orderTotal(ev,o))+'</span>'+I.chev+'</a>';
    }).join("")+'</div>':'<p class="empty">No custom orders coming up.</p>')+'</div><p class="foot">Past custom orders are in History.</p></main>';
  dock('<a class="btn primary" href="#/custom/setup">New custom order</a>');
  tabbar("home");
}
function viewCustomSetup(q){
  var ev=q.id?S.events[q.id]:null;
  var key="custom:"+(q.id||"new");
  if(!draft||draft.key!==key){
    var o=ev&&ev.orders[0];
    draft={key:key,kind:"custom",name:o?o.name:"",ch:o?o.ch:"dm",date:ev?ev.date:(q.d||addDays(todayKey(),2)),lines:{},price:{}};
    if(ev){ o.lines.forEach(function(l){ draft.lines[l.ref]=l.qty; if(l.price!=null) draft.price[l.ref]=l.price; }); }
  }
  var fake={kind:"custom",items:S.menus.lunch.map(function(i){return {id:i.id,name:i.name,price:i.price};}),combos:[]};
  var total=0; Object.keys(draft.lines).forEach(function(ref){ total+=linePrice(fake,{ref:ref,qty:draft.lines[ref],price:draft.price[ref]}); });
  var groups=LUNCH_GROUPS.map(function(g){
    var items=S.menus.lunch.filter(function(i){return i.group===g;}).sort(function(a,b){ var qa=draft.lines[a.id]?0:1,qb=draft.lines[b.id]?0:1; return qa-qb||a.name.localeCompare(b.name); });
    if(!items.length) return "";
    return '<div class="sgroup"><div class="grouphead">'+g+'</div><div class="list">'+items.map(function(it){
      var qn=draft.lines[it.id]||0, lp=linePrice(fake,{ref:it.id,qty:qn,price:draft.price[it.id]});
      return '<div class="pick wrap" data-name="'+esc(normName(it.name))+'"><span class="grow"><span class="nm">'+esc(it.name)+'</span><span class="meta" style="display:block">'+(it.price==null?"No price":rupee(it.price)+" each")+'</span></span>'+
        stepper("csStep('"+it.id+"',",qn)+
        (qn?'<div class="lp">Line price <span class="money-in"><input type="number" inputmode="numeric" aria-label="Line price" value="'+lp+'" oninput="draft.price[\''+it.id+'\']=num(this.value);csTotal()"></span></div>':'')+'</div>';
    }).join("")+'</div></div>';
  }).join("");
  $app.innerHTML=bar(ev?"Edit custom order":"New custom order",ev?"#/custom/"+ev.id:"#/custom")+'<main class="page">'+
    '<div class="field"><label class="f" for="cname">Customer name</label><input type="text" id="cname" autocomplete="off" autocapitalize="words" value="'+esc(draft.name)+'" oninput="draft.name=this.value;csTotal()"></div>'+
    '<div class="field"><label class="f" for="cdate">Date</label><input type="date" id="cdate" value="'+draft.date+'" onchange="draft.date=this.value"></div>'+
    '<div class="field"><label class="f">Came in on</label><div class="seg" role="group"><button aria-pressed="'+(draft.ch==="dm")+'" onclick="draft.ch=\'dm\';render()">DM</button><button aria-pressed="'+(draft.ch==="group")+'" onclick="draft.ch=\'group\';render()">Group</button></div></div>'+
    '<div class="section"><h2>Their menu</h2><p class="sub" style="margin:-4px 0 0">From the lunch list, at the standing price. Change a line\'s price if you agreed something else.</p>'+'<input type="search" class="search" placeholder="Search dishes" aria-label="Search dishes" oninput="filterDishes(this.value)">'+groups+
    '<button class="btn secondary block" onclick="newItemSheet(\'lunch\',false)">New dish</button></div></main>';
  dock('<div class="tot num" style="align-self:center;min-width:84px"><span class="small muted" style="display:block">Total</span><b id="csTot" style="font-size:20px">'+rupee(total)+'</b></div><button class="btn primary" id="csSave" onclick="saveCustom()">'+(ev?"Save":"Save order")+'</button>');
  csTotal(); tabbar("home");
}
function stepper(fnPrefix,q){ return '<span class="step"><button aria-label="Less" '+(q?'':'disabled')+' onclick="'+fnPrefix+'-1)">−</button><span class="q">'+q+'</span><button aria-label="More" onclick="'+fnPrefix+'1)">+</button></span>'; }
function csStep(ref,d){ var q=(draft.lines[ref]||0)+d; if(q<=0) delete draft.lines[ref]; else draft.lines[ref]=q; delete draft.price[ref]; render(); }
function csTotal(){
  var fake={kind:"custom",items:S.menus.lunch.map(function(i){return {id:i.id,name:i.name,price:i.price};}),combos:[]};
  var t=0; Object.keys(draft.lines).forEach(function(ref){ t+=linePrice(fake,{ref:ref,qty:draft.lines[ref],price:draft.price[ref]}); });
  var el=document.getElementById("csTot"); if(el) el.textContent=rupee(t);
  var b=document.getElementById("csSave"); if(b) b.disabled=!(draft.name.trim()&&Object.keys(draft.lines).length&&draft.date);
}
function saveCustom(){
  var ev=draft.key!=="custom:new"?S.events[draft.key.split(":")[1]]:null;
  var refs=Object.keys(draft.lines);
  var items=refs.map(function(ref){ var i=S.menus.lunch.filter(function(x){return x.id===ref;})[0]; return {id:i.id,name:i.name,group:i.group,price:i.price}; });
  var lines=refs.map(function(ref){ return {ref:ref,qty:draft.lines[ref],price:draft.price[ref]!==undefined?draft.price[ref]:null}; });
  if(ev){ var o=ev.orders[0]; ev.date=draft.date; ev.items=items; o.name=draft.name.trim(); o.ch=draft.ch; o.lines=lines; }
  else { ev={id:uid(),kind:"custom",date:draft.date,status:"open",items:items,combos:[],createdAt:Date.now(),
      orders:[{id:uid(),name:draft.name.trim(),ch:draft.ch,lines:lines,delivered:false,paid:false,paidAt:null,changeDue:0,changeGiven:false,t:Date.now()}]};
    S.events[ev.id]=ev; }
  save(); draft=null; go("#/custom/"+ev.id); toast("Custom order saved");
}
function viewCustom(id){
  var ev=S.events[id]; if(!ev||!ev.orders[0]) return go("#/custom");
  var o=ev.orders[0], kc=kitchenCount(ev).filter(function(c){return c.q;});
  $app.innerHTML=bar("Custom order",isPast(ev)?"#/history":"#/custom",'<a class="act" href="#/custom/setup?id='+ev.id+'">Edit</a>')+'<main class="page">'+
    '<h2 class="title" style="margin-top:6px">'+esc(o.name||"No name")+'</h2><p class="sub">'+relDate(ev.date)+(relDate(ev.date)!==fmtDate(ev.date)?" · "+fmtDate(ev.date):"")+' · '+(o.ch==="dm"?"DM":"Group")+'</p>'+
    '<div class="section"><h2>To cook<span class="aside num">'+rupee(orderTotal(ev,o))+'</span></h2><div class="card pad count">'+kc.map(function(c){
      var ln=o.lines.filter(function(l){return l.ref===c.it.id;})[0];
      return '<div class="ci"><div class="cn">'+esc(c.it.name)+'<div class="t2 num">'+rupee(linePrice(ev,ln))+'</div></div><div class="cv">'+c.q+'</div></div>';
    }).join("")+'</div></div>'+
    '<div class="section"><div class="list">'+orderRow(ev,o)+'</div></div>'+
    '<div class="section"><button class="btn danger" onclick="deleteCustom(\''+ev.id+'\')">Delete custom order</button></div></main>';
  tabbar(isPast(ev)?"history":"home");
}
function deleteCustom(id){ var ev=S.events[id]; if(!ev) return; if(!confirm("Delete the custom order for "+(ev.orders[0].name||"this customer")+"? This can't be undone.")) return; delete S.events[id]; save(); go("#/custom"); toast("Custom order deleted"); }

/* ======================= ORDER SHEET ======================= */
var od=null;
function openOrder(evId,oId){
  var ev=S.events[evId]; if(!ev) return;
  if(ev.kind==="custom"){ go("#/custom/setup?id="+ev.id); return; }
  var o=oId?ev.orders.filter(function(x){return x.id===oId;})[0]:null;
  od={evId:evId,oId:oId||null,name:o?o.name:"",ch:o?o.ch:"dm",lines:o?JSON.parse(JSON.stringify(o.lines)):[],
      paid:o?!!o.paid:false,changeDue:o?(o.changeDue||0):0,changeGiven:o?!!o.changeGiven:false,untracked:o?!!o.untracked:false};
  openSheet({title:o?"Edit order":"New order",body:'<div id="odBody"></div>',foot:'<div class="tot num"><span>Total</span><b id="odTot">₹0</b></div><button class="btn primary" id="odSave" onclick="saveOrder()">'+(o?"Save":"Save order")+'</button>'});
  drawOrder();
  if(!o) setTimeout(function(){ var n=document.getElementById("odName"); if(n) n.focus(); },280);
}
function drawOrder(){
  var ev=S.events[od.evId], h="";
  h+='<div class="field"><label class="f" for="odName">Name</label><input type="text" id="odName" autocomplete="off" autocapitalize="words" value="'+esc(od.name)+'" oninput="od.name=this.value;odTotals()"></div>';
  h+='<div class="field"><label class="f">Came in on</label><div class="seg" role="group"><button aria-pressed="'+(od.ch==="dm")+'" onclick="od.ch=\'dm\';drawOrder()">DM</button><button aria-pressed="'+(od.ch==="group")+'" onclick="od.ch=\'group\';drawOrder()">Group</button></div></div>';
  if(ev.kind==="lunch"){
    if(ev.combos&&ev.combos.length) h+='<div class="grouphead">Combos</div><div class="list">'+ev.combos.map(function(c){ return countPick(ev,"combo:"+c.id,c.name,rupee(c.price)+" · "+c.dishes.map(function(d){var it=evItem(ev,d);return it?it.name:"";}).join(", ")); }).join("")+'</div>';
    LUNCH_GROUPS.forEach(function(g){
      var items=ev.items.filter(function(i){return i.group===g;}); if(!items.length) return;
      h+='<div class="grouphead">'+g+'</div><div class="list">'+items.map(function(it){ return countPick(ev,it.id,it.name,it.price==null?"No price":rupee(it.price)+" each"); }).join("")+'</div>';
    });
  } else if(ev.kind==="batter"){
    h+='<div class="grouphead">Items</div><div class="list">'+ev.items.map(function(it){
      var lines=od.lines.map(function(l,ix){return {l:l,ix:ix};}).filter(function(x){return x.l.ref===it.id;});
      return '<div class="pick" style="display:block"><div style="display:flex;align-items:baseline;gap:8px"><span class="nm grow">'+esc(it.name)+'</span><span class="meta num">'+(it.rate==null?"No price":rupee(it.rate)+"/kg")+'</span></div>'+
        '<div class="wchips">'+[0.5,0.75,1].map(function(kg){return '<button class="chip" onclick="addW(\''+it.id+'\','+kg+')">'+kgLabel(kg)+'</button>';}).join("")+'<button class="chip" onclick="addW(\''+it.id+'\',null)">Other weight</button></div>'+
        (lines.length?'<div style="margin-top:6px">'+lines.map(function(x){ return weightLine(ev,it,x.l,x.ix); }).join("")+'</div>':'')+'</div>';
    }).join("")+'</div>';
  } else if(ev.kind==="drop"){
    h+='<div class="grouphead">Items</div><div class="list">'+ev.items.map(function(it){
      if(it.unit==="kg"){
        var ix=lineIx(it.id), l=ix>=0?od.lines[ix]:null;
        return '<div class="pick" style="display:block"><div style="display:flex;align-items:baseline;gap:8px"><span class="nm grow">'+esc(it.name)+'</span><span class="meta num">'+priceDesc(it)+'</span></div>'+
          '<div style="display:flex;align-items:center;gap:10px;margin-top:8px;flex-wrap:wrap"><label class="small muted" for="kg_'+it.id+'">Quantity</label><span style="display:inline-flex;align-items:center;gap:6px"><input type="number" inputmode="decimal" step="0.05" min="0" id="kg_'+it.id+'" style="width:88px;height:38px;text-align:right" value="'+(l?l.qty:"")+'" placeholder="0" oninput="setKg(\''+it.id+'\',this.value)"><span class="small muted">kg</span></span>'+
          '<span id="lp_'+it.id+'" style="margin-left:auto">'+(l&&l.qty?priceInput(ev,l,ix):'')+'</span></div></div>';
      }
      return countPick(ev,it.id,it.name,priceDesc(it));
    }).join("")+'</div>';
  }
  if(od.oId){
    h+='<div class="section"><h2>Payment</h2><div class="card pad">'+(od.untracked?'<p class="sub" style="margin:0">Brought in from the old app without payment tracking.</p>':
      '<label class="check"><input type="checkbox" '+(od.paid?'checked':'')+' onchange="od.paid=this.checked;drawOrder()">Paid in full</label>')+
      (od.paid?'<div style="display:flex;align-items:center;gap:10px;margin-top:6px"><span class="grow">Change to give back</span><span class="money-in"><input type="number" inputmode="numeric" aria-label="Change to give back" value="'+(od.changeDue||"")+'" placeholder="0" oninput="od.changeDue=num(this.value)||0"></span></div>'+
        (od.changeDue>0?'<label class="check"><input type="checkbox" '+(od.changeGiven?'checked':'')+' onchange="od.changeGiven=this.checked">Change given</label>':'<p class="hint">If they paid extra and will collect the change later.</p>'):'')+
      '</div></div><div class="section"><button class="btn danger" onclick="deleteOrder()">Delete order</button></div>';
  }
  document.getElementById("odBody").innerHTML=h;
  odTotals();
}
function lineIx(ref){ for(var i=0;i<od.lines.length;i++) if(od.lines[i].ref===ref) return i; return -1; }
function countPick(ev,ref,name,meta){
  var ix=lineIx(ref), q=ix>=0?od.lines[ix].qty:0;
  return '<div class="pick wrap"><span class="grow"><span class="nm">'+esc(name)+'</span><span class="meta" style="display:block">'+esc(meta)+'</span></span>'+
    stepper("odStep('"+ref+"',",q)+(q?'<div class="lp">Line price '+priceInput(ev,od.lines[ix],ix)+'</div>':'')+'</div>';
}
function priceInput(ev,l,ix){ return '<span class="money-in"><input type="number" inputmode="numeric" aria-label="Line price" value="'+linePrice(ev,l)+'" oninput="od.lines['+ix+'].price=num(this.value);odTotals()"></span>'; }
function weightLine(ev,it,l,ix){
  return '<div class="wline"><span class="kg"><input type="number" inputmode="decimal" step="0.05" min="0" aria-label="Weight in kg" value="'+l.qty+'" onchange="setLineKg('+ix+',this.value)"> <span class="small muted">kg</span></span>'+
    (it.topping!=null?'<label class="check" style="min-height:38px;padding:0;gap:8px"><input type="checkbox" '+(l.top?'checked':'')+' onchange="od.lines['+ix+'].top=this.checked;od.lines['+ix+'].price=null;drawOrder()"><span class="small">With topping</span></label>':'')+
    '<span style="margin-left:auto">'+priceInput(ev,l,ix)+'</span><button class="x" style="margin-left:0" aria-label="Remove line" onclick="od.lines.splice('+ix+',1);drawOrder()">'+I.x+'</button></div>';
}
function odStep(ref,d){ var ix=lineIx(ref); if(ix<0){ if(d>0) od.lines.push({ref:ref,qty:1,price:null}); } else { var l=od.lines[ix]; l.qty+=d; l.price=null; if(l.qty<=0) od.lines.splice(ix,1); } drawOrder(); }
function addW(ref,kg){
  if(kg===null){ var v=prompt("Weight in kg (for example 1.5 or 0.3)"); kg=num(v); if(!kg||kg<=0) return; }
  od.lines.push({ref:ref,qty:kg,top:false,price:null}); drawOrder();
}
function setLineKg(ix,v){ var kg=num(v); if(!kg||kg<=0){ od.lines.splice(ix,1); } else { od.lines[ix].qty=kg; od.lines[ix].price=null; } drawOrder(); }
function setKg(ref,v){
  var kg=num(v), ix=lineIx(ref), ev=S.events[od.evId];
  if(!kg||kg<=0){ if(ix>=0) od.lines.splice(ix,1); }
  else if(ix<0) od.lines.push({ref:ref,qty:kg,price:null});
  else { od.lines[ix].qty=kg; od.lines[ix].price=null; }
  ix=lineIx(ref); var slot=document.getElementById("lp_"+ref);
  if(slot) slot.innerHTML=ix>=0?priceInput(ev,od.lines[ix],ix):"";
  odTotals();
}
function odTotals(){
  var ev=S.events[od.evId], t=od.lines.reduce(function(a,l){return a+linePrice(ev,l);},0);
  var el=document.getElementById("odTot"); if(el) el.textContent=rupee(t);
  var b=document.getElementById("odSave"); if(b) b.disabled=!(od.name.trim()&&od.lines.some(function(l){return Number(l.qty)>0;}));
}
function saveOrder(){
  var ev=S.events[od.evId]; var lines=od.lines.filter(function(l){return Number(l.qty)>0;});
  if(od.oId){
    var o=ev.orders.filter(function(x){return x.id===od.oId;})[0];
    o.name=od.name.trim(); o.ch=od.ch; o.lines=lines;
    if(!o.untracked){ if(o.paid!==od.paid) o.paidAt=od.paid?Date.now():null; o.paid=od.paid; }
    o.changeDue=od.paid?(od.changeDue||0):0; o.changeGiven=od.changeGiven;
  } else {
    ev.orders.push({id:uid(),name:od.name.trim(),ch:od.ch,lines:lines,delivered:false,paid:false,paidAt:null,changeDue:0,changeGiven:false,t:Date.now()});
  }
  save(); var nm=od.name.trim(); closeSheet(); render(); toast(od.oId?"Order saved":nm+" added");
}
function deleteOrder(){
  var ev=S.events[od.evId]; var o=ev.orders.filter(function(x){return x.id===od.oId;})[0];
  var ix=ev.orders.indexOf(o); ev.orders.splice(ix,1); save(); closeSheet(); render();
  toast("Order for "+(o.name||"customer")+" deleted",function(){ ev.orders.splice(ix,0,o); save(); render(); });
}

    '<div class="field"><label class="f" for="niPair">Price for 2 (optional, per piece or portion)</label><span class="money-in"><input type="number" inputmode="numeric" id="niPair" style="width:140px" oninput="ni.pair=num(this.value)"></span></div>'+

function niState(){ var b=document.getElementById("niSave"); if(b) b.disabled=!ni.name.trim(); }
function saveNewItem(){
  var id=uid(), nm=ni.name.trim(), item;
  if(ni.kind==="lunch") item={id:id,name:nm,group:ni.group,price:ni.price,last:null};
  if(ni.kind==="batter") item={id:id,name:nm,rate:ni.price,topping:ni.topping,last:null};
  if(ni.kind==="drops") item={id:id,name:nm,unit:ni.unit,rate:ni.price,pair:ni.unit==="kg"?null:ni.pair};
  if(ni.kind!=="drops"||ni.save||!ni.toDraft) S.menus[ni.kind].push(item);
  if(draft&&ni.toDraft){
    if(draft.kind==="lunch"){ draft.sel[id]=true; draft.price[id]=item.price; }
    if(draft.kind==="batter"){ draft.sel[id]=true; draft.rate[id]=item.rate; draft.top[id]=item.topping; }
    if(draft.kind==="drop") draft.items.push({id:id,name:nm,unit:item.unit,rate:item.rate,pair:item.pair});
  }
  save(); closeSheet(); render(); toast(nm+" added");
}

function editItem(kind,id){

function saveItemEdit(){
  var it=S.menus[ni.kind].filter(function(i){return i.id===ni.id;})[0];
  it.name=ni.name.trim()||it.name;
  if(ni.kind==="lunch"){ it.group=ni.group; it.price=ni.price; }
  if(ni.kind==="batter"){ it.rate=ni.price; if(it.topping!=null) it.topping=ni.topping; }
  if(ni.kind==="drops"){ it.unit=ni.unit; it.rate=ni.price; it.pair=ni.unit==="kg"?null:ni.pair; }
  save(); closeSheet(); render(); toast("Saved");
}
function removeItem(){
  var arr=S.menus[ni.kind], ix=-1; arr.forEach(function(i,k){ if(i.id===ni.id) ix=k; });
  if(ix<0) return; var it=arr.splice(ix,1)[0]; save(); closeSheet(); render();
  toast(it.name+" removed",function(){ arr.splice(ix,0,it); save(); render(); });
}

/* ======================= COSTS ======================= */
/* What an item costs to make. Ingredient prices are his, typed once and kept in a list here,
   never in the menu lists. A lunch dish takes its tier's pot (up to 1 veg, 2 veg, more than 2)
   until he gives it a recipe of its own. One overhead percentage covers spices, gas and labour.
   Profit is only shown for a whole month. Nothing here is guessed: no price, no cost. */
var ING_UNITS={kg:{per:"per kg",amt:"g",div:1000},L:{per:"per litre",amt:"ml",div:1000},piece:{per:"per piece",amt:"pieces",div:1},bunch:{per:"per bunch",amt:"bunches",div:1}};
var TIERS=[[1,"Up to 1 vegetable"],[2,"2 vegetables"],[3,"More than 2"]];
var MAKES_WORD={portions:"portion",kg:"kg",pieces:"piece"};
function costs(){ if(!S.costs) S.costs={overhead:15,ings:[],recipes:[]}; return S.costs; }
function overhead(){ var o=Number(costs().overhead); return isFinite(o)?o:15; }
function ingById(id){ return costs().ings.filter(function(g){return g.id===id;})[0]||null; }
function ingByName(n){ return costs().ings.filter(function(g){return normName(g.name)===normName(n);})[0]||null; }
function recipeById(id){ return costs().recipes.filter(function(r){return r.id===id;})[0]||null; }
function menuItem2(kind,id){ return S.menus[kind].filter(function(i){return i.id===id;})[0]||null; }
function itemRecipeId(kind,id){ return kind+"_"+id; }
function money1(n){ if(n==null) return "—"; var a=Math.abs(n); if(a>=100) return rupee(n); var r=Math.round(n*10)/10; return (r<0?"−":"")+"₹"+String(Math.abs(r)); }
function makesUnit(kind,it){ if(kind==="batter") return "kg"; if(kind==="drops") return it&&it.unit==="kg"?"kg":it&&it.unit==="portion"?"portions":"pieces"; return "portions"; }
function sellPrice(kind,it){ if(!it) return null; return num(kind==="lunch"?it.price:it.rate); }
function guessTier(it){ if(!it||it.group!=="Curries") return null; return {50:1,60:2,70:3}[Number(it.price)]||null; }
function dishTier(it){ return it?(it.tier||guessTier(it)):null; }

function recipeCost(r){
  var sum=0, missing=[], noAmt=[], n=0;
  (r.lines||[]).forEach(function(l){
    var g=ingById(l.ing), q=Number(l.qty)||0; if(!g) return;
    if(!(q>0)){ noAmt.push(g.name); return; } n++;
    if(g.price==null||g.price===""){ missing.push(g.name); return; }
    sum+=Number(g.price)*q/ING_UNITS[g.unit].div;
  });
  var oh=sum*overhead()/100, total=sum+oh, makes=Number(r.makes)||0;
  return {ing:sum,oh:oh,total:total,missing:missing,noAmt:noAmt,lines:n,per:(makes>0&&n&&!missing.length&&!noAmt.length)?total/makes:null};
}
/* cost of one portion / kg / piece of a menu item, or null when it can't be known yet */
function costInfo(kind,id){
  var r=recipeById(itemRecipeId(kind,id));
  if(r) return {per:recipeCost(r).per,src:"own"};
  if(kind==="lunch"){
    var t=dishTier(menuItem2("lunch",id)), tr=t&&recipeById("tier"+t);
    if(t) return {per:tr?recipeCost(tr).per:null,src:"tier",tier:t};
  }
  return {per:null,src:null};
}
function unitCost(kind,id){ return costInfo(kind,id).per; }
function costLabel(ci){
  if(ci.src==="own") return ci.per==null?"Own recipe, not finished":"Own recipe";
  if(ci.src==="tier") return TIERS[ci.tier-1][1]+(ci.per==null?", tier not costed yet":"");
  return "Not costed";
}

/* a line on an order, at today's costs */
function menuKindOf(ev){ return ev.kind==="batter"?"batter":ev.kind==="drop"?"drops":"lunch"; }
function menuIdFor(mk,it){ if(menuItem2(mk,it.id)) return it.id; var m=S.menus[mk].filter(function(x){return normName(x.name)===normName(it.name);})[0]; return m?m.id:null; }
function lineCost(ev,ln){
  var q=Number(ln.qty)||0; if(!q) return {c:0};
  if(isCombo(ln.ref)){
    var cb=evCombo(ev,ln.ref); if(!cb) return {c:0}; var s=0, miss=[];
    cb.dishes.forEach(function(d){ var it=evItem(ev,d), mid=it&&menuIdFor("lunch",it), u=mid?unitCost("lunch",mid):null; if(u==null) miss.push(it?it.name:"dish"); else s+=u; });
    return miss.length?{c:null,names:miss}:{c:s*q};
  }
  var it=evItem(ev,ln.ref); if(!it) return {c:0};
  var mk=menuKindOf(ev), mid=menuIdFor(mk,it), u=mid?unitCost(mk,mid):null;
  return u==null?{c:null,names:[it.name]}:{c:u*q};
}
function monthReport(ym){
  var cats={lunch:{rev:0,cost:0,unc:0},batter:{rev:0,cost:0,unc:0},drop:{rev:0,cost:0,unc:0},custom:{rev:0,cost:0,unc:0}}, missing={};
  events().filter(function(e){return e.date&&e.date.slice(0,7)===ym;}).forEach(function(ev){
    var c=cats[ev.kind]; if(!c) return;
    ev.orders.forEach(function(o){ (o.lines||[]).forEach(function(ln){
      var p=linePrice(ev,ln), lc=lineCost(ev,ln); c.rev+=p;
      if(lc.c==null){ c.unc+=p; lc.names.forEach(function(n){ missing[n]=(missing[n]||0)+p; }); } else c.cost+=lc.c;
    }); });
  });
  var t={rev:0,cost:0,unc:0}; Object.keys(cats).forEach(function(k){ t.rev+=cats[k].rev; t.cost+=cats[k].cost; t.unc+=cats[k].unc; });
  return {cats:cats,total:t,missing:missing};
}
function monthName(ym){ var p=ym.split("-"); return ["January","February","March","April","May","June","July","August","September","October","November","December"][Number(p[1])-1]+" "+p[0]; }
function addMonths(ym,n){ var p=ym.split("-"), d=new Date(Number(p[0]),Number(p[1])-1+n,1); return d.getFullYear()+"-"+pad2(d.getMonth()+1); }

/* ---------- the Costs tab ---------- */
function viewCosts(){
  rd=null;
  var t=todayKey(), lt=lunchOn(t), ltm=lunchOn(addDays(t,1)), ev=lt||ltm, ym=t.slice(0,7), rep=monthReport(ym);
  var lunchHtml='';
  if(ev){
    lunchHtml='<div class="section"><h2>'+(lt?"Today's lunch":"Tomorrow's lunch")+'<span class="aside">cost per portion</span></h2><div class="list">'+
      ev.items.map(function(it){
        var mid=menuIdFor("lunch",it), ci=mid?costInfo("lunch",mid):{per:null,src:null};
        var inner='<span class="grow"><span class="t1" style="display:block">'+esc(it.name)+'</span><span class="t2" style="display:block">'+esc(costLabel(ci))+'</span></span><span class="val num" style="font-weight:500">'+money1(ci.per)+'</span>';
        return mid?'<a class="row" href="#/costs/item/lunch/'+mid+'">'+inner+I.chev+'</a>':'<div class="row">'+inner+'</div>';
      }).join("")+'</div></div>';
  }
  var own=costs().recipes.filter(function(r){return r.kind==="item";}).map(function(r){ return {r:r,it:menuItem2(r.menuKind,r.menuId)}; }).filter(function(x){return x.it;})
    .sort(function(a,b){return a.it.name.localeCompare(b.it.name);});
  var tierRows=TIERS.map(function(tt){
    var r=recipeById("tier"+tt[0]), per=r?recipeCost(r).per:null;
    var used=S.menus.lunch.filter(function(i){return dishTier(i)===tt[0]&&!recipeById(itemRecipeId("lunch",i.id));}).length;
    return '<a class="row" href="#/costs/tier/'+tt[0]+'"><span class="grow"><span class="t1" style="display:block">'+tt[1]+'</span><span class="t2" style="display:block">'+(!r?"No recipe yet · ":per==null?"Not finished · ":"")+plural(used,"dish","dishes")+'</span></span><span class="val num" style="font-weight:500">'+money1(per)+'</span>'+I.chev+'</a>';
  }).join("");
  var ownRows=own.map(function(x){
    var per=recipeCost(x.r).per, kindWord={lunch:"Lunch",batter:"Batter",drops:"Drops"}[x.r.menuKind];
    return '<a class="row" href="#/costs/item/'+x.r.menuKind+'/'+x.r.menuId+'"><span class="grow"><span class="t1" style="display:block">'+esc(x.it.name)+'</span><span class="t2" style="display:block">'+kindWord+' · per '+MAKES_WORD[x.r.unit]+'</span></span><span class="val num" style="font-weight:500">'+money1(per)+'</span>'+I.chev+'</a>';
  }).join("");
  var noPrice=costs().ings.filter(function(g){return g.price==null||g.price==="";}).length;
  var mt=rep.total;
  $app.innerHTML='<header class="bar"><h1 style="padding-left:8px">Costs</h1></header><main class="page">'+
    lunchHtml+
    '<div class="section"><h2>Curry tiers<span class="aside">cost per portion</span></h2><div class="list">'+tierRows+'</div>'+
      '<p class="hint">Each curry and rasam takes its tier\'s cost until you give it its own recipe.</p></div>'+
    '<div class="section"><h2>Own recipes</h2>'+(ownRows?'<div class="list">'+ownRows+'</div>':'<p class="empty">None yet. Cost an item to give it a recipe of its own.</p>')+'</div>'+
    '<div class="section"><h2>'+monthName(ym)+'</h2><a class="card owedrow" style="margin-top:0" href="#/costs/month?m='+ym+'"><span><span style="font-weight:500">Monthly report</span><span class="sub" style="display:block;margin:0">'+rupee(mt.rev)+' revenue so far'+(mt.unc?' · some items not costed':'')+'</span></span><span style="margin-left:auto;display:flex">'+I.chev+'</span></a></div>'+
    '<div class="section"><h2>Settings</h2><div class="list">'+
      '<a class="row" href="#/costs/ingredients"><span class="grow"><span class="t1" style="display:block">Ingredients</span><span class="t2" style="display:block">'+plural(costs().ings.length,"ingredient")+(noPrice?' · '+noPrice+' with no price':'')+'</span></span>'+I.chev+'</a>'+
      '<button class="row" onclick="editOverhead()"><span class="grow"><span class="t1" style="display:block">Overhead</span><span class="t2" style="display:block">Spices, gas and labour, on top of ingredients</span></span><span class="val num" style="font-weight:500">'+overhead()+'%</span>'+I.chev+'</button>'+
    '</div></div></main>';
  dock('<button class="btn primary" onclick="pickCostItem()">Cost an item</button>');
  tabbar("costs");
}
function editOverhead(){
  openSheet({title:"Overhead",short:true,
    body:'<div class="field"><label class="f" for="ohIn">Overhead on top of ingredients</label><span style="display:flex;align-items:center;gap:8px"><input type="number" inputmode="decimal" id="ohIn" style="width:100px;text-align:right" value="'+overhead()+'"><span>%</span></span><p class="ferr" id="ohErr" hidden></p><p class="hint">Covers spices, gas and labour. Every cost uses it.</p></div>',
    foot:'<button class="btn primary" onclick="saveOverhead()">Save</button>'});
}
function saveOverhead(){ var v=num(document.getElementById("ohIn").value); if(v==null||v<0){ var e=document.getElementById("ohErr"); e.textContent="Enter a percentage, 0 or more."; e.hidden=false; return; } costs().overhead=v; save(); closeSheet(); render(); toast("Overhead "+v+"%"); }

var cpk=null;
function pickCostItem(){
  cpk={q:""};
  openSheet({title:"Cost an item",body:'<input type="search" class="search" placeholder="Search lunch, batter and drops" oninput="cpk.q=this.value;drawCostPick()" aria-label="Search items"><div id="cpList"></div>'});
  drawCostPick();
}
function drawCostPick(){
  var q=normName(cpk.q), html="";
  [["lunch","Lunch"],["batter","Batter"],["drops","Drops"]].forEach(function(k){
    var items=S.menus[k[0]].filter(function(i){return !q||normName(i.name).indexOf(q)>=0;}).sort(function(a,b){return a.name.localeCompare(b.name);});
    if(!items.length) return;
    html+='<div class="grouphead">'+k[1]+'</div><div class="list">'+items.map(function(i){
      var ci=costInfo(k[0],i.id);
      return '<button class="row" onclick="go(\'#/costs/item/'+k[0]+'/'+i.id+'\')"><span class="grow"><span class="t1" style="display:block">'+esc(i.name)+'</span><span class="t2" style="display:block">'+esc(costLabel(ci))+'</span></span><span class="val num">'+money1(ci.per)+'</span></button>';
    }).join("")+'</div>';
  });
  document.getElementById("cpList").innerHTML=html||'<p class="empty" style="margin-top:12px">Nothing matches.</p>';
}

/* ---------- a lunch dish on its tier, or any item's own recipe ---------- */
function viewCostItem(kind,id,q){
  var it=menuItem2(kind,id); if(!it){ go("#/costs"); return; }
  var rid=itemRecipeId(kind,id);
  if(q&&q.tier&&rd&&rd.id===rid&&rd.isNew) rd=null;   /* backing out of a recipe he hadn't saved */
  if(recipeById(rid)||(rd&&rd.id===rid)||kind!=="lunch") return viewRecipe(rid,kind,it);
  rd=null;
  var t=dishTier(it), guessed=!it.tier&&t, tr=t&&recipeById("tier"+t), per=tr?recipeCost(tr).per:null, price=sellPrice(kind,it);
  $app.innerHTML=bar(it.name,"#/costs")+'<main class="page">'+
    '<p class="sub">Sells at '+(price==null?"no price yet":rupee(price)+" a portion")+'</p>'+
    '<div class="section"><h2>Tier</h2><div class="seg full" role="group" aria-label="Tier">'+TIERS.map(function(tt){
      return '<button aria-pressed="'+(t===tt[0])+'" onclick="setDishTier(\''+id+'\','+tt[0]+')">'+tt[1].replace("Up to 1 vegetable","Up to 1 veg").replace("2 vegetables","2 veg")+'</button>';
    }).join("")+'</div><p class="hint">'+(guessed?"First guess from its price. Change it if the ingredients say otherwise.":t?"":"Pick the tier closest to what goes in, or give it its own recipe.")+'</p></div>'+
    (t?'<div class="section">'+marginCard(per,price,"portions",tr?null:"The "+TIERS[t-1][1].toLowerCase()+" tier has no recipe yet.")+
      '<div class="btnrow"><a class="btn text" href="#/costs/tier/'+t+'?from='+id+'">'+(tr?"Edit":"Set up")+' the tier recipe</a></div></div>':'')+
    '</main>';
  dock('<button class="btn primary" onclick="ownRecipe(\''+id+'\')">Give it its own recipe</button>');
  tabbar("costs");
}
function setDishTier(id,t){ var it=menuItem2("lunch",id); if(!it) return; it.tier=t; save(); render(); }
function ownRecipe(id){
  var it=menuItem2("lunch",id), t=dishTier(it), tr=t&&recipeById("tier"+t);
  rd={id:itemRecipeId("lunch",id),kind:"item",menuKind:"lunch",menuId:id,unit:"portions",makes:tr?tr.makes:null,
      lines:tr?tr.lines.map(function(l){return {ing:l.ing,qty:l.qty};}):[],isNew:true};
  render();
}
function viewTier(n,q){ return viewRecipe("tier"+n,null,null,q&&q.from&&menuItem2("lunch",q.from)?"#/costs/item/lunch/"+q.from:null); }

function marginCard(per,price,unit,note){
  var w=MAKES_WORD[unit];
  var rows='<div class="ci"><div class="cn">Cost per '+w+'</div><div class="cv">'+money1(per)+'</div></div>'+
    '<div class="ci"><div class="cn">Sells at</div><div class="cv" style="color:var(--text)">'+(price==null?"—":rupee(price))+'</div></div>';
  if(per!=null&&price!=null&&price>0){ var left=price-per; rows+='<div class="ci"><div class="cn"><b style="font-weight:500">Left per '+w+'</b></div><div class="cv" style="color:'+(left<0?'var(--negative)':'var(--text)')+'">'+money1(left)+'<small>'+Math.round(left/price*100)+'%</small></div></div>'; }
  return '<div class="card pad count">'+rows+'</div>'+(note?'<p class="hint">'+esc(note)+'</p>':'');
}

/* ---------- the recipe calculator ---------- */
var rd=null;
function viewRecipe(rid,kind,it,from){
  var isTier=rid.indexOf("tier")===0, n=isTier?Number(rid.slice(4)):0;
  if(!rd||rd.id!==rid){
    var r=recipeById(rid);
    rd=r?JSON.parse(JSON.stringify(r)):(isTier?{id:rid,kind:"tier",tier:n,unit:"portions",makes:null,lines:[],isNew:true}
        :{id:rid,kind:"item",menuKind:kind,menuId:it.id,unit:makesUnit(kind,it),makes:null,lines:[],isNew:true});
  }
  if(rd.base===undefined) rd.base=rdShape(rd);
  var title=isTier?"Tier: "+TIERS[n-1][1]:it.name;
  var sub=isTier?"One typical pot. Every curry on this tier without its own recipe uses its cost.":
    ({lunch:"Lunch dish",batter:"Batter",drops:"Drop item"}[kind])+" · sells at "+(sellPrice(kind,it)==null?"no price yet":rupee(sellPrice(kind,it))+" per "+MAKES_WORD[rd.unit]);
  /* a saved recipe sits on the dish's own route, so back can't point there: it goes to Costs.
     A new own recipe for a lunch dish backs out to the dish's tier */
  var back=from||(!isTier&&kind==="lunch"&&rd.isNew?"#/costs/item/lunch/"+it.id+"?tier=1":"#/costs");
  rd.back=from||"#/costs";
  $app.innerHTML=bar(title,back)+'<main class="page"><p class="sub">'+esc(sub)+'</p>'+
    '<div class="section"><h2>Ingredients</h2><div class="card pad" id="rdLines">'+rdLinesHtml()+'</div>'+
      '<p class="ferr" id="rdErr" hidden></p><div class="btnrow"><button class="btn secondary" onclick="addRecipeLine()">Add ingredient</button></div></div>'+
    '<div class="section"><h2>Makes</h2><div style="display:flex;align-items:center;gap:10px"><input type="number" inputmode="decimal" id="rdMakes" style="width:110px;text-align:right" value="'+(rd.makes==null?"":rd.makes)+'" oninput="rd.makes=num(this.value);rdSum()" aria-label="How much it makes"><span>'+rd.unit+'</span></div>'+
      '<p class="hint">How much this '+(rd.unit==="portions"?"pot":"batch")+' gives you. Cost per '+MAKES_WORD[rd.unit]+' is the total divided by this.</p></div>'+
    '<div class="section"><h2>Cost</h2><div id="rdSum">'+rdSumHtml(kind,it)+'</div></div>'+
    (!rd.isNew?'<div class="section"><button class="btn danger" onclick="removeRecipe()">'+(isTier?"Clear this tier recipe":kind==="lunch"?"Remove own recipe, go back to its tier":"Remove this recipe")+'</button></div>':'')+
    '</main>';
  rd.ctx={kind:kind,it:it};
  dock('<button class="btn primary" onclick="saveRecipe()">Save</button>');
  tabbar("costs");
}
function rdShape(r){ return JSON.stringify({m:num(r.makes),l:r.lines.map(function(l){return [l.ing,num(l.qty)];})}); }
function rdDirty(){ return !!(rd&&rd.base!==undefined&&rdShape(rd)!==rd.base); }
/* leaving a recipe with unsaved edits asks first */
function leaveRecipeOk(){ if(!rdDirty()) return true; if(!confirm("Discard your changes to this recipe?")) return false; rd=null; return true; }
function rdLinesHtml(){
  if(!rd.lines.length) return '<p class="muted small">No ingredients yet.</p>';
  return rd.lines.map(function(l,ix){
    var g=ingById(l.ing); if(!g) return '';
    var u=ING_UNITS[g.unit], c=(g.price==null||g.price==="")?null:Number(g.price)*(Number(l.qty)||0)/u.div;
    return '<div class="rline"><div><div style="font-weight:500">'+esc(g.name)+'</div><div class="small muted">'+(g.price==null||g.price===""?"No price yet":rupee(g.price)+" "+u.per)+'</div></div>'+
      '<button class="x" aria-label="Remove '+esc(g.name)+'" onclick="rd.lines.splice('+ix+',1);render()">'+I.x+'</button>'+
      '<span style="display:flex;align-items:center;gap:8px"><input type="number" inputmode="decimal" style="width:96px;height:40px;text-align:right" value="'+(l.qty==null?"":l.qty)+'" aria-label="Amount of '+esc(g.name)+' in '+u.amt+'" oninput="rd.lines['+ix+'].qty=num(this.value);rdSum()"><span class="small muted">'+u.amt+'</span></span>'+
      '<span class="num" id="rdc'+ix+'" style="text-align:right;font-weight:500;align-self:center;padding-right:12px">'+money1(c)+'</span></div>';
  }).join("");
}
function rdSumHtml(kind,it){
  var rc=recipeCost(rd);
  var rows='<div class="ci"><div class="cn">Ingredients</div><div class="cv" style="color:var(--text)">'+money1(rc.ing)+'</div></div>'+
    '<div class="ci"><div class="cn">Overhead '+overhead()+'%<div class="t2">spices, gas, labour</div></div><div class="cv" style="color:var(--text)">'+money1(rc.oh)+'</div></div>'+
    '<div class="ci"><div class="cn"><b style="font-weight:500">Total for the '+(rd.unit==="portions"?"pot":"batch")+'</b></div><div class="cv" style="color:var(--text)">'+money1(rc.total)+'</div></div>';
  var note=rc.missing.length?"No price yet for "+rc.missing.join(", ")+". Add it under Ingredients.":rc.noAmt.length?"Fill in the amount of "+rc.noAmt.join(", ")+".":(!rc.lines?"Add ingredients to see the cost.":(!(Number(rd.makes)>0)?"Fill in how much it makes.":null));
  var price=it?sellPrice(kind,it):null;
  return '<div class="card pad count">'+rows+'</div><div style="margin-top:10px">'+(it?marginCard(rc.per,price,rd.unit,note):'<div class="card pad count"><div class="ci"><div class="cn">Cost per portion</div><div class="cv">'+money1(rc.per)+'</div></div></div>'+(note?'<p class="hint">'+esc(note)+'</p>':''))+'</div>';
}
function rdSum(){
  var el=document.getElementById("rdSum"); if(el) el.innerHTML=rdSumHtml(rd.ctx&&rd.ctx.kind,rd.ctx&&rd.ctx.it);
  rd.lines.forEach(function(l,ix){ var g=ingById(l.ing), c=document.getElementById("rdc"+ix); if(g&&c) c.textContent=money1(g.price==null||g.price===""?null:Number(g.price)*(Number(l.qty)||0)/ING_UNITS[g.unit].div); });
}
function saveRecipe(){
  if(!rd.lines.some(function(l){return ingById(l.ing);})){ var e=document.getElementById("rdErr"); if(e){ e.textContent="Add at least one ingredient to save this recipe."; e.hidden=false; } return; }
  var r={id:rd.id,kind:rd.kind,unit:rd.unit,makes:rd.makes,lines:rd.lines.filter(function(l){return ingById(l.ing);}).map(function(l){return {ing:l.ing,qty:l.qty};})};
  if(rd.kind==="tier") r.tier=rd.tier; else { r.menuKind=rd.menuKind; r.menuId=rd.menuId; }
  var arr=costs().recipes, ix=-1; arr.forEach(function(x,k){ if(x.id===r.id) ix=k; });
  if(ix>=0) arr[ix]=r; else arr.push(r);
  var back=rd.back||"#/costs"; save(); rd=null; go(back); toast("Saved");
}
function removeRecipe(){
  var arr=costs().recipes, ix=-1; arr.forEach(function(x,k){ if(x.id===rd.id) ix=k; }); if(ix<0) return;
  var r=arr.splice(ix,1)[0], toTier=r.kind==="item"&&r.menuKind==="lunch"; rd=null; save();
  if(toTier) render(); else go("#/costs");
  toast("Recipe removed",function(){ arr.splice(ix,0,r); save(); render(); });
}
var ipk=null;
function addRecipeLine(){
  ipk={q:""};
  openSheet({title:"Add ingredient",body:'<input type="search" class="search" placeholder="Search your ingredients" oninput="ipk.q=this.value;drawIngPick()" aria-label="Search ingredients"><div id="ipList"></div>',
    foot:'<button class="btn secondary" onclick="ingSheet(null,true)">New ingredient</button>'});
  drawIngPick();
}
function drawIngPick(){
  var q=normName(ipk.q), used={}; rd.lines.forEach(function(l){used[l.ing]=1;});
  var items=costs().ings.filter(function(g){return !used[g.id]&&(!q||normName(g.name).indexOf(q)>=0);}).sort(function(a,b){return a.name.localeCompare(b.name);});
  document.getElementById("ipList").innerHTML=items.length?'<div class="list" style="margin-top:10px">'+items.map(function(g){
    return '<button class="row" onclick="pickIng(\''+g.id+'\')"><span class="grow"><span class="t1" style="display:block">'+esc(g.name)+'</span><span class="t2" style="display:block">'+(g.price==null||g.price===""?"No price yet":rupee(g.price)+" "+ING_UNITS[g.unit].per)+'</span></span></button>';
  }).join("")+'</div>':'<p class="empty" style="margin-top:10px">'+(costs().ings.length?"Nothing matches. Add it as a new ingredient.":"No ingredients yet. Add the first one.")+'</p>';
}
function pickIng(id){ rd.lines.push({ing:id,qty:null}); closeSheet(); render(); setTimeout(function(){ var ins=document.querySelectorAll("#rdLines input"); if(ins.length) ins[ins.length-1].focus(); },50); }

/* ---------- ingredients ---------- */
function viewIngredients(){
  var items=costs().ings.slice().sort(function(a,b){return a.name.localeCompare(b.name);});
  $app.innerHTML=bar("Ingredients","#/costs")+'<main class="page"><p class="sub">What you pay for each. Change a price here and every recipe using it updates.</p>'+
    (items.length?'<div class="list" style="margin-top:12px">'+items.map(function(g){
      var used=costs().recipes.filter(function(r){return r.lines.some(function(l){return l.ing===g.id;});}).length;
      return '<button class="row" onclick="ingSheet(\''+g.id+'\')"><span class="grow"><span class="t1" style="display:block">'+esc(g.name)+'</span><span class="t2" style="display:block">'+(used?"In "+plural(used,"recipe"):"Not in a recipe yet")+'</span></span><span class="val num">'+(g.price==null||g.price===""?'<span class="pill warn">No price</span>':rupee(g.price)+' <span class="small muted">'+ING_UNITS[g.unit].per+'</span>')+'</span>'+I.chev+'</button>';
    }).join("")+'</div>':'<p class="empty" style="margin-top:12px">No ingredients yet. Add what you buy, with what you paid.</p>')+'</main>';
  dock('<button class="btn primary" onclick="ingSheet(null)">New ingredient</button>');
  tabbar("costs");
}
var ie=null;
function ingSheet(id,forRecipe){
  var g=id?ingById(id):null;
  ie={id:id,name:g?g.name:"",price:g?g.price:null,unit:g?g.unit:"kg",forRecipe:!!forRecipe};
  var inUse=g?costs().recipes.filter(function(r){return r.lines.some(function(l){return l.ing===g.id;});}).length:0;
  var b='<div class="field"><label class="f" for="ieName">Name</label><input type="text" id="ieName" autocapitalize="words" value="'+esc(ie.name)+'" oninput="ie.name=this.value;ieState()"></div>'+
    '<div class="field"><label class="f" for="iePrice">What you pay</label><span style="display:flex;gap:8px;align-items:center"><span class="money-in"><input type="number" inputmode="decimal" id="iePrice" style="width:120px" value="'+(ie.price==null?"":ie.price)+'" oninput="ie.price=num(this.value)"></span>'+
      '<select id="ieUnit" style="width:auto;flex:1" onchange="ie.unit=this.value" aria-label="Per"'+(inUse?' disabled':'')+'>'+Object.keys(ING_UNITS).map(function(u){return '<option value="'+u+'" '+(u===ie.unit?'selected':'')+'>'+ING_UNITS[u].per+'</option>';}).join("")+'</select></span>'+
      '<p class="ferr" id="ieErr" hidden></p><p class="hint">Leave it blank if you don\'t know yet. Recipes using it will say so.'+(inUse?' It\'s in '+plural(inUse,"recipe")+', so its unit stays '+ING_UNITS[ie.unit].per+'.':'')+'</p></div>'+
    (g?'<div class="section"><button class="btn danger" onclick="removeIng()">Remove ingredient</button><p class="hint">It comes out of every recipe that uses it.</p></div>':'');
  if(sheetOpen) closeSheet(true);
  openSheet({title:g?"Edit ingredient":"New ingredient",short:true,body:b,foot:'<button class="btn primary" id="ieSave" '+(ie.name.trim()?'':'disabled')+' onclick="saveIng()">'+(g?"Save":"Add")+'</button>'});
  if(!g) setTimeout(function(){ var n=document.getElementById("ieName"); if(n) n.focus(); },280);
}
function ieState(){ var b=document.getElementById("ieSave"); if(b) b.disabled=!ie.name.trim(); }
function saveIng(){
  var nm=ie.name.trim(); if(!nm) return;
  if(ie.price!=null&&ie.price<0){ var e=document.getElementById("ieErr"); e.textContent="A price can't be below zero."; e.hidden=false; return; }
  var dup=ingByName(nm); if(dup&&dup.id!==ie.id){ toast(dup.name+" is already in the list"); return; }
  var g;
  if(ie.id){ g=ingById(ie.id); g.name=nm; g.price=ie.price; g.unit=ie.unit; }
  else { g={id:uid(),name:nm,price:ie.price,unit:ie.unit}; costs().ings.push(g); }
  if(ie.forRecipe&&rd) rd.lines.push({ing:g.id,qty:null});
  save(); closeSheet(); render(); toast(ie.id?"Saved":nm+" added");
}
function removeIng(){
  var c=costs(), ix=-1; c.ings.forEach(function(g,k){ if(g.id===ie.id) ix=k; }); if(ix<0) return;
  var g=c.ings.splice(ix,1)[0], snap=c.recipes.map(function(r){return JSON.stringify(r.lines);});
  c.recipes.forEach(function(r){ r.lines=r.lines.filter(function(l){return l.ing!==g.id;}); });
  save(); closeSheet(); render();
  toast(g.name+" removed",function(){ c.ings.splice(ix,0,g); c.recipes.forEach(function(r,k){ r.lines=JSON.parse(snap[k]); }); save(); render(); });
}

}

/* ======================= HISTORY ======================= */
/* revenue by category for a month ("2026-10") or for everything ("all"); the days listed under Past, so the counts match; unpaid orders count, they get followed up */
function revenueBy(per){
  var r={total:0,n:0,cats:{lunch:{rev:0,n:0},batter:{rev:0,n:0},drop:{rev:0,n:0},custom:{rev:0,n:0}}};
  events().forEach(function(ev){
    if(!isPast(ev)) return;
    if(per!=="all"&&(ev.date||"").slice(0,7)!==per) return;
    var c=r.cats[ev.kind]; if(!c) return;
    var st=eventStats(ev); c.rev+=st.total; c.n+=st.n; r.total+=st.total; r.n+=st.n;
  });
  return r;
}
/* the History filters change the page in place, without jumping back to the top */
function histSet(k,v){
  var m=/[?&]f=([^&]*)/.exec(current), p=/[?&]p=([^&]*)/.exec(current);
  var o={f:m?m[1]:"all",p:p?p[1]:"month"}; o[k]=v;
  var h="#/history?f="+o.f+"&p="+o.p, y=window.scrollY;
  current=h; try{ history.replaceState(null,"",h); }catch(e){}
  render(); window.scrollTo(0,y);
}

/* ======================= DATA: backup, restore, old app import ======================= */
function exportBackup(){
  var blob=new Blob([JSON.stringify(S,null,1)],{type:"application/json"});
  var a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="south-savory-v2-backup-"+todayKey()+".json";
  document.body.appendChild(a); a.click(); setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); },500);
  toast("Backup downloaded");
}
var fileMode=null;
function pickFile(mode){ fileMode=mode; var f=document.getElementById("fileIn"); f.value=""; f.click(); }
document.getElementById("fileIn").addEventListener("change",function(e){
  var file=e.target.files[0]; if(!file) return;
  var r=new FileReader();
  r.onload=function(){
    var data; try{ data=JSON.parse(r.result); }catch(err){ toast("That file isn't a backup"); return; }
    if(fileMode==="restore"){
      if(!data||data.version!==2||!data.events){ toast("That isn't a backup from this app"); return; }
      if(!confirm("Replace everything on this phone with this backup?")) return;
      S=data; if(!S.costs) S.costs={overhead:15,ings:[],recipes:[]}; save(); render(); toast("Backup restored");
    } else {
      if(!data||!data.days){ toast("That isn't a backup from the old app"); return; }
      var res=importOld(data); save(); render(); toast(res);
    }
  };
  r.readAsText(file);
});

/* The old app's batter and specials history comes across as order summaries — who ordered,
   what, how much — with every line carrying the exact rupee amount the old app recorded,
   so no total moves. Lunch history stays in the old app. Old prices he set himself
   update the menu lists. Running it twice adds nothing twice. */
function importOld(old){
  S.meta.oldKeys=S.meta.oldKeys||{};
  var nb=0,nd=0,unpaidN=0,unpaidAmt=0,pricesN=0;
  var BS={half:0.5,threeq:0.75,kilo:1};
  function oldBatterPrice(b,size,top){
    var base=(size==="threeq"&&(b.prices.threeq==null||b.prices.threeq===""))?Math.round(0.75*Number(b.prices.kilo||0)):Number(b.prices[size]||0);
    return base+(top?Number(b.prices.top||0):0);
  }
  function menuItem(kind,name){ return S.menus[kind].filter(function(i){return normName(i.name)===normName(name);})[0]; }
  Object.keys(old.batter||{}).forEach(function(k){
    var b=old.batter[k]; if(!b||!b.prices) return;
    var key="batter:"+k; if(S.meta.oldKeys[key]) return;
    var mi=menuItem("batter",b.type||"Batter");
    var item={id:mi?mi.id:uid(),name:b.type||"Batter",rate:Number(b.prices.kilo)||null,topping:b.top?Number(b.prices.top||0):null};
    var ev={id:uid(),kind:"batter",date:b.date||k,status:b.closed?"closed":"open",items:[item],orders:[],createdAt:Date.now(),imported:true};
    (b.slips||[]).forEach(function(sl){
      var lines=[];
      Object.keys(sl.items||{}).forEach(function(key2){
        var q=Number(sl.items[key2])||0; if(!q) return; var p=String(key2).split("|"), size=p[1], top=p[2]==="top";
        lines.push({ref:item.id,qty:Math.round(BS[size]*q*1000)/1000,top:top,price:q*oldBatterPrice(b,size,top)});
      });
      if(!lines.length) return;
      var o={id:uid(),name:sl.name||"",ch:sl.ch||"group",lines:lines,delivered:!!sl.collected,paid:!!sl.paid,paidAt:sl.paidAt||null,changeDue:0,changeGiven:false,t:sl.t||Date.now()};
      if(!o.paid){ unpaidN++; unpaidAmt+=orderTotal(ev,o); }
      ev.orders.push(o);
    });
    var anon=(b.orders||[]).filter(function(o){return Number(o.q)>0;});
    if(anon.length) ev.orders.push({id:uid(),name:"Taps without a name",ch:"group",untracked:true,delivered:true,paid:false,t:anon[0].t||0,
      lines:anon.map(function(o){ return {ref:item.id,qty:Math.round((BS[o.size]||0)*o.q*1000)/1000,top:!!o.top,price:Number(o.q)*Number(o.p||0)}; })});
    if(!ev.orders.length&&b.closed===undefined) return;
    S.events[ev.id]=ev; S.meta.oldKeys[key]=1; nb++;
  });
  Object.keys(old.special||{}).forEach(function(k){
    var sp=old.special[k]; if(!sp) return;
    var key="drop:"+(sp.id||k); if(S.meta.oldKeys[key]) return;
    var ev={id:uid(),kind:"drop",title:sp.title||"Drop",date:sp.deliveryDate||todayKey(),status:sp.closed?"closed":"open",items:[],orders:[],createdAt:Date.now(),imported:true};
    var itemsById={}; (sp.items||[]).forEach(function(it){ itemsById[it.id]=it; });
    function refFor(lineId){
      var parts=String(lineId).split("::"), it=itemsById[parts[0]]; if(!it) return null;
      var sub=parts[1], isW=it.priceMode==="weight", sz=!isW&&sub&&it.sizes?it.sizes.filter(function(s){return s.id===sub;})[0]:null;
      var id="old_"+parts[0]+(isW?"":(sz?"_"+sub:""));
      if(!evItem(ev,id)){
        if(isW) ev.items.push({id:id,name:it.n,unit:"kg",rate:Number(it.ratePerKg)||null,pair:null});
        else ev.items.push({id:id,name:it.n+(sz&&sz.label?" ("+sz.label+")":(it.u&&it.u!=="piece"?" ("+it.u+")":"")),unit:"piece",rate:sz?Number(sz.p):Number(it.p),pair:null});
      }
      return {id:id,grams:isW?Number(sub):null,unitPrice:isW?Math.round((Number(it.ratePerKg)||0)*Number(sub)/1000):(sz?Number(sz.p):Number(it.p||0))};
    }
    (sp.slips||[]).forEach(function(sl){
      var lines=[];
      Object.keys(sl.items||{}).forEach(function(lid){
        var q=Number(sl.items[lid])||0; if(!q) return; var r=refFor(lid); if(!r) return;
        lines.push({ref:r.id,qty:r.grams?Math.round(q*r.grams)/1000:q,price:q*r.unitPrice});
      });
      if(!lines.length) return;
      var o={id:uid(),name:sl.name||"",ch:sl.ch||"group",lines:lines,delivered:!!sl.collected,paid:!!sl.paid,paidAt:sl.paidAt||null,changeDue:0,changeGiven:false,t:sl.t||Date.now()};
      if(!o.paid){ unpaidN++; unpaidAmt+=orderTotal(ev,o); }
      ev.orders.push(o);
    });
    var anon=(sp.orders||[]).filter(function(o){return Number(o.q)>0&&refFor(o.id2);});
    if(anon.length) ev.orders.push({id:uid(),name:"Taps without a name",ch:"group",untracked:true,delivered:true,paid:false,t:0,
      lines:anon.map(function(o){ var r=refFor(o.id2); return {ref:r.id,qty:r.grams?Math.round(o.q*r.grams)/1000:o.q,price:Number(o.q)*Number(o.p||0)}; })});
    (sp.items||[]).forEach(function(it){
      if(menuItem("drops",it.n)) return;
      var unit="piece",rate=num(it.p);
      if(it.priceMode==="weight"){ unit="kg"; rate=num(it.ratePerKg); }
      else if(it.u==="kg"){ unit="kg"; }
      else if(it.u==="½ kg"&&rate!=null){ unit="kg"; rate=rate*2; }
      else if(it.u==="250 g"&&rate!=null){ unit="kg"; rate=rate*4; }
      else if(it.sizes&&it.sizes.length) rate=null;
      S.menus.drops.push({id:uid(),name:it.n,unit:unit,rate:rate,pair:null});
    });
    S.events[ev.id]=ev; S.meta.oldKeys[key]=1; nd++;
  });
  /* his own prices from the old app win over the seed */
  function setP(kind,name,field,v){ var it=menuItem(kind,name); if(it&&v!=null&&v!==""&&isFinite(Number(v))&&it[field]!==Number(v)){ it[field]=Number(v); pricesN++; } }
  Object.keys(old.dishPrice||{}).forEach(function(n){ setP("lunch",n,"price",(old.dishPrice[n]||{}).ala); });
  if(old.compPrice){ setP("lunch","Rice","price",old.compPrice.rice); setP("lunch","Curd rice","price",old.compPrice.curd); }
  if(old.flatPrice){ setP("lunch","Ragi ball","price",old.flatPrice.ragi); setP("lunch","Menthya ball","price",old.flatPrice.mudde); }
  Object.keys(old.batPrice||{}).forEach(function(t){ var p=old.batPrice[t]||{}; setP("batter",t,"rate",p.kilo); if(p.top!=null) setP("batter",t,"topping",p.top); });
  /* ingredient prices he typed into the old app's Costing screen; its looked-up market prices stay behind */
  var ingN=0, OLDU={"Milk":"L","Oil":"L","Coconut":"piece","Raw banana":"piece","Lemon":"piece","Papad (raw)":"piece","Greens (soppu)":"bunch","Coriander":"bunch","Mint":"bunch","Curry leaves":"bunch"};
  var oc=old.cost||{};
  Object.keys(oc.ingPrice||{}).forEach(function(n){
    var v=num(oc.ingPrice[n]); if(v==null||ingByName(n)) return;
    var u=(oc.ingUnit||{})[n]||OLDU[n]||"kg"; if(u==="l"||u==="litre") u="L"; if(!ING_UNITS[u]) u="kg";
    costs().ings.push({id:uid(),name:n,price:v,unit:u}); ingN++;
  });
  var msg="Brought in "+nb+" batter "+(nb===1?"batch":"batches")+" and "+nd+" "+(nd===1?"drop":"drops")+" · "+unpaidN+" unpaid "+(unpaidN===1?"order":"orders")+" worth "+rupee(unpaidAmt)+(pricesN?" · "+pricesN+" of your prices applied":"")+(ingN?" · "+plural(ingN,"ingredient price"):"");
  if(!nb&&!nd&&!pricesN&&!ingN) return "Nothing new in that file. It was brought in before.";
  S.meta.imported=msg+" ("+fmtDate(todayKey())+")";
  return msg;
}

/* ======================= SHEET + TOAST ======================= */
var sheetOpen=false, sheetOnClose=null;
function openSheet(o){
  sheetOnClose=o.onclose||null;
  var root=document.getElementById("sheetRoot");
  root.innerHTML='<div class="scrim" onclick="closeSheet()"></div><div class="sheet'+(o.short?' short':'')+'" role="dialog" aria-modal="true" aria-label="'+esc(o.title)+'">'+
    '<div class="drag"><div class="grab" aria-hidden="true"></div><div class="sh">'+(o.cancel===false?'<span style="min-width:72px"></span>':'<button class="btn text" onclick="closeSheet()">Cancel</button>')+'<h2>'+esc(o.title)+'</h2><span style="min-width:72px"></span></div></div>'+
    '<div class="sb">'+o.body+'</div>'+(o.foot?'<div class="sf">'+o.foot+'</div>':'')+'</div>';
  sheetOpen=true; document.body.style.overflow="hidden";
  /* swipe down on the grabber or title bar to dismiss, as on iOS */
  var sh=root.querySelector(".sheet"), dg=root.querySelector(".drag"), y0=null, dy=0;
  dg.addEventListener("pointerdown",function(e){ if(e.target.closest("button")) return; y0=e.clientY; dy=0; sh.classList.add("dragging"); dg.setPointerCapture(e.pointerId); });
  dg.addEventListener("pointermove",function(e){ if(y0===null) return; dy=Math.max(0,e.clientY-y0); sh.style.transform="translateY("+dy+"px)"; });
  function end(){ if(y0===null) return; y0=null; sh.classList.remove("dragging"); sh.style.transform=""; if(dy>110) closeSheet(); }
  dg.addEventListener("pointerup",end); dg.addEventListener("pointercancel",end);
  requestAnimationFrame(function(){ requestAnimationFrame(function(){ root.querySelector(".scrim").classList.add("show"); root.querySelector(".sheet").classList.add("show"); }); });
}
function closeSheet(instant){
  var root=document.getElementById("sheetRoot"); if(!sheetOpen) return;
  sheetOpen=false; document.body.style.overflow="";
  var after=sheetOnClose; sheetOnClose=null; if(after) setTimeout(after,0);
  if(SYNC.needRender) setTimeout(softRender,300);
  var s=root.querySelector(".sheet"), sc=root.querySelector(".scrim");
  if(instant||!s){ root.innerHTML=""; return; }
  s.classList.remove("show"); sc.classList.remove("show"); setTimeout(function(){ if(!sheetOpen) root.innerHTML=""; },260);
}
document.addEventListener("keydown",function(e){ if(e.key==="Escape"&&sheetOpen) closeSheet(); });
var toastT=null;
function toast(msg,undo){
  var t=document.getElementById("toast");
  t.innerHTML='<span>'+esc(msg)+'</span>'+(undo?'<button id="toastUndo">Undo</button>':'');
  if(undo) document.getElementById("toastUndo").onclick=function(){ undo(); t.classList.remove("show"); };
  t.classList.add("show"); clearTimeout(toastT); toastT=setTimeout(function(){ t.classList.remove("show"); },undo?5000:2600);
}

save(); render(); syncStart();
