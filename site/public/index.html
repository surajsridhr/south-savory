  var owedHtml=og.length?og.map(function(g){
    return '<div class="card" style="margin-top:8px"><div class="pad" style="display:flex;align-items:baseline;gap:10px;padding-bottom:4px"><span style="font-weight:500;flex:1">'+esc(g.name)+'</span><span class="amt num" style="font-weight:700">'+rupee(g.total)+'</span></div>'+
      g.rows.map(function(r){
        return '<div class="row" style="padding-top:8px;padding-bottom:8px"><a class="grow" href="'+evRoute(r.ev)+'" style="color:inherit;text-decoration:none"><span class="t1 small" style="display:block;font-weight:400">'+esc(evLabel(r.ev))+'</span><span class="t2" style="display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+esc(orderWhat(r.ev,r.o))+'</span></a>'+
          '<span class="val num small">'+rupee(r.t)+'</span><button class="chip unpaid" onclick="togglePaid(\''+r.ev.id+'\',\''+r.o.id+'\')">Mark paid</button></div>';
      }).join("")+'</div>';
  }).join(""):'<p class="empty">Nobody owes anything.</p>';
  var chHtml=ch.length?'<div class="list">'+ch.map(function(r){
    return '<div class="row"><span class="grow"><span class="t1" style="display:block">'+esc(r.o.name||"No name")+'</span><span class="t2" style="display:block">'+esc(evLabel(r.ev))+'</span></span><span class="val num" style="font-weight:500">'+rupee(r.o.changeDue)+'</span><button class="chip" onclick="giveChange(\''+r.ev.id+'\',\''+r.o.id+'\')">Given</button></div>';
  }).join("")+'</div>':'<p class="empty">No change owed to anyone.</p>';
  var fl=[["all","All"],["lunch","Lunch"],["batter","Batter"],["drop","Drops"],["custom","Custom"]];
  $app.innerHTML='<header class="bar"><h1 style="padding-left:8px">History</h1></header><main class="page">'+
    '<div class="section" style="margin-top:4px"><h2>Unpaid<span class="aside num">'+(og.length?rupee(og.reduce(function(a,g){return a+g.total;},0))+" · oldest first":"")+'</span></h2>'+owedHtml+'</div>'+
    '<div class="section"><h2>Change to give</h2>'+chHtml+'</div>'+
    '<div class="section"><h2>Past</h2><div class="filters" role="group" aria-label="Filter">'+fl.map(function(x){return '<button class="chip" aria-pressed="'+(f===x[0])+'" onclick="go(\'#/history?f='+x[0]+'\')">'+x[1]+'</button>';}).join("")+'</div>'+
      (past.length?'<div class="list" style="margin-top:10px">'+past.map(function(ev){ var st=eventStats(ev);
        return '<a class="row" href="'+evRoute(ev)+'"><span class="grow"><span class="t1" style="display:block">'+esc(evLabel(ev))+'</span><span class="t2" style="display:block">'+st.n+' '+(st.n===1?"order":"orders")+(st.unpaid?' · '+rupee(st.unpaid)+' unpaid':'')+(ev.imported?' · old app':'')+'</span></span><span class="amt num">'+rupee(st.total)+'</span>'+I.chev+'</a>'; }).join("")+'</div>':'<p class="empty" style="margin-top:10px">Nothing here yet.</p>')+'</div>'+
    '<div class="section"><h2>Data</h2><div class="card pad"><p class="small" id="syncState">'+(SYNC.on?esc(syncText()):"Everything is saved on this phone. Export a backup now and then.")+'</p>'+
      (S.meta.imported?'<p class="small muted" style="margin-top:6px">'+esc(S.meta.imported)+'</p>':'')+
      '<div class="btnrow" style="margin-top:10px"><button class="btn secondary" onclick="pickFile(\'old\')">Bring in old app data</button><button class="btn secondary" onclick="exportBackup()">Export backup</button><button class="btn text" onclick="pickFile(\'restore\')">Restore a backup</button></div></div></div>'+
    '<p class="foot">'+BUILD+'</p></main>';
  tabbar("history");
}

/* ======================= DATA: backup, restore, old app import ======================= */
function exportBackup(){
  var blob=new Blob([JSON.stringify(S,null,1)],{type:"application/json"});
  var a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="south-savory-v2-backup-"+todayKey()+".json";
  document.body.appendChild(a); a.click(); setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); },500);
  toast("Backup downloaded");
}
var fileMode=null;
function pickFile(mode){ fileMode=mode; var f=document.getElementById("fileIn"); f.value=""; f.click(); }
document.getElementById("fileIn").addEventListener("change",function(e){
  var file=e.target.files[0]; if(!file) return;
  var r=new FileReader();
  r.onload=function(){
    var data; try{ data=JSON.parse(r.result); }catch(err){ toast("That file isn't a backup"); return; }
    if(fileMode==="restore"){
      if(!data||data.version!==2||!data.events){ toast("That isn't a backup from this app"); return; }
      if(!confirm("Replace everything on this phone with this backup?")) return;
      S=data; save(); render(); toast("Backup restored");
    } else {
      if(!data||!data.days){ toast("That isn't a backup from the old app"); return; }
      var res=importOld(data); save(); render(); toast(res);
    }
  };
  r.readAsText(file);
});

/* The old app's batter and specials history comes across as order summaries — who ordered,
   what, how much — with every line carrying the exact rupee amount the old app recorded,
   so no total moves. Lunch history stays in the old app. Old prices he set himself
   update the menu lists. Running it twice adds nothing twice. */
function importOld(old){
  S.meta.oldKeys=S.meta.oldKeys||{};
  var nb=0,nd=0,unpaidN=0,unpaidAmt=0,pricesN=0;
  var BS={half:0.5,threeq:0.75,kilo:1};
  function oldBatterPrice(b,size,top){
    var base=(size==="threeq"&&(b.prices.threeq==null||b.prices.threeq===""))?Math.round(0.75*Number(b.prices.kilo||0)):Number(b.prices[size]||0);
    return base+(top?Number(b.prices.top||0):0);
  }
  function menuItem(kind,name){ return S.menus[kind].filter(function(i){return normName(i.name)===normName(name);})[0]; }
  Object.keys(old.batter||{}).forEach(function(k){
    var b=old.batter[k]; if(!b||!b.prices) return;
    var key="batter:"+k; if(S.meta.oldKeys[key]) return;
    var mi=menuItem("batter",b.type||"Batter");
    var item={id:mi?mi.id:uid(),name:b.type||"Batter",rate:Number(b.prices.kilo)||null,topping:b.top?Number(b.prices.top||0):null};
    var ev={id:uid(),kind:"batter",date:b.date||k,status:b.closed?"closed":"open",items:[item],orders:[],createdAt:Date.now(),imported:true};
    (b.slips||[]).forEach(function(sl){
      var lines=[];
      Object.keys(sl.items||{}).forEach(function(key2){
        var q=Number(sl.items[key2])||0; if(!q) return; var p=String(key2).split("|"), size=p[1], top=p[2]==="top";
        lines.push({ref:item.id,qty:Math.round(BS[size]*q*1000)/1000,top:top,price:q*oldBatterPrice(b,size,top)});
      });
      if(!lines.length) return;
      var o={id:uid(),name:sl.name||"",ch:sl.ch||"group",lines:lines,delivered:!!sl.collected,paid:!!sl.paid,paidAt:sl.paidAt||null,changeDue:0,changeGiven:false,t:sl.t||Date.now()};
      if(!o.paid){ unpaidN++; unpaidAmt+=orderTotal(ev,o); }
      ev.orders.push(o);
    });
    var anon=(b.orders||[]).filter(function(o){return Number(o.q)>0;});
    if(anon.length) ev.orders.push({id:uid(),name:"Taps without a name",ch:"group",untracked:true,delivered:true,paid:false,t:anon[0].t||0,
      lines:anon.map(function(o){ return {ref:item.id,qty:Math.round((BS[o.size]||0)*o.q*1000)/1000,top:!!o.top,price:Number(o.q)*Number(o.p||0)}; })});
    if(!ev.orders.length&&b.closed===undefined) return;
    S.events[ev.id]=ev; S.meta.oldKeys[key]=1; nb++;
  });
  Object.keys(old.special||{}).forEach(function(k){
    var sp=old.special[k]; if(!sp) return;
    var key="drop:"+(sp.id||k); if(S.meta.oldKeys[key]) return;
    var ev={id:uid(),kind:"drop",title:sp.title||"Drop",date:sp.deliveryDate||todayKey(),status:sp.closed?"closed":"open",items:[],orders:[],createdAt:Date.now(),imported:true};
    var itemsById={}; (sp.items||[]).forEach(function(it){ itemsById[it.id]=it; });
    function refFor(lineId){
      var parts=String(lineId).split("::"), it=itemsById[parts[0]]; if(!it) return null;
      var sub=parts[1], isW=it.priceMode==="weight", sz=!isW&&sub&&it.sizes?it.sizes.filter(function(s){return s.id===sub;})[0]:null;
      var id="old_"+parts[0]+(isW?"":(sz?"_"+sub:""));
      if(!evItem(ev,id)){
        if(isW) ev.items.push({id:id,name:it.n,unit:"kg",rate:Number(it.ratePerKg)||null,pair:null});
        else ev.items.push({id:id,name:it.n+(sz&&sz.label?" ("+sz.label+")":(it.u&&it.u!=="piece"?" ("+it.u+")":"")),unit:"piece",rate:sz?Number(sz.p):Number(it.p),pair:null});
      }
      return {id:id,grams:isW?Number(sub):null,unitPrice:isW?Math.round((Number(it.ratePerKg)||0)*Number(sub)/1000):(sz?Number(sz.p):Number(it.p||0))};
    }
    (sp.slips||[]).forEach(function(sl){
      var lines=[];
      Object.keys(sl.items||{}).forEach(function(lid){
        var q=Number(sl.items[lid])||0; if(!q) return; var r=refFor(lid); if(!r) return;
        lines.push({ref:r.id,qty:r.grams?Math.round(q*r.grams)/1000:q,price:q*r.unitPrice});
      });
      if(!lines.length) return;
      var o={id:uid(),name:sl.name||"",ch:sl.ch||"group",lines:lines,delivered:!!sl.collected,paid:!!sl.paid,paidAt:sl.paidAt||null,changeDue:0,changeGiven:false,t:sl.t||Date.now()};
      if(!o.paid){ unpaidN++; unpaidAmt+=orderTotal(ev,o); }
      ev.orders.push(o);
    });
    var anon=(sp.orders||[]).filter(function(o){return Number(o.q)>0&&refFor(o.id2);});
    if(anon.length) ev.orders.push({id:uid(),name:"Taps without a name",ch:"group",untracked:true,delivered:true,paid:false,t:0,
      lines:anon.map(function(o){ var r=refFor(o.id2); return {ref:r.id,qty:r.grams?Math.round(o.q*r.grams)/1000:o.q,price:Number(o.q)*Number(o.p||0)}; })});
    (sp.items||[]).forEach(function(it){
      if(menuItem("drops",it.n)) return;
      var unit="piece",rate=num(it.p);
      if(it.priceMode==="weight"){ unit="kg"; rate=num(it.ratePerKg); }
      else if(it.u==="kg"){ unit="kg"; }
      else if(it.u==="½ kg"&&rate!=null){ unit="kg"; rate=rate*2; }
      else if(it.u==="250 g"&&rate!=null){ unit="kg"; rate=rate*4; }
      else if(it.sizes&&it.sizes.length) rate=null;
      S.menus.drops.push({id:uid(),name:it.n,unit:unit,rate:rate,pair:null});
    });
    S.events[ev.id]=ev; S.meta.oldKeys[key]=1; nd++;
  });
  /* his own prices from the old app win over the seed */
  function setP(kind,name,field,v){ var it=menuItem(kind,name); if(it&&v!=null&&v!==""&&isFinite(Number(v))&&it[field]!==Number(v)){ it[field]=Number(v); pricesN++; } }
  Object.keys(old.dishPrice||{}).forEach(function(n){ setP("lunch",n,"price",(old.dishPrice[n]||{}).ala); });
  if(old.compPrice){ setP("lunch","Rice","price",old.compPrice.rice); setP("lunch","Curd rice","price",old.compPrice.curd); }
  if(old.flatPrice){ setP("lunch","Ragi ball","price",old.flatPrice.ragi); setP("lunch","Menthya ball","price",old.flatPrice.mudde); }
  Object.keys(old.batPrice||{}).forEach(function(t){ var p=old.batPrice[t]||{}; setP("batter",t,"rate",p.kilo); if(p.top!=null) setP("batter",t,"topping",p.top); });
  var msg="Brought in "+nb+" batter "+(nb===1?"batch":"batches")+" and "+nd+" "+(nd===1?"drop":"drops")+" · "+unpaidN+" unpaid "+(unpaidN===1?"order":"orders")+" worth "+rupee(unpaidAmt)+(pricesN?" · "+pricesN+" of your prices applied":"");
  if(!nb&&!nd&&!pricesN) return "Nothing new in that file. It was brought in before.";
  S.meta.imported=msg+" ("+fmtDate(todayKey())+")";
  return msg;
}

/* ======================= SHEET + TOAST ======================= */
var sheetOpen=false;
function openSheet(o){
  var root=document.getElementById("sheetRoot");
  root.innerHTML='<div class="scrim" onclick="closeSheet()"></div><div class="sheet'+(o.short?' short':'')+'" role="dialog" aria-modal="true" aria-label="'+esc(o.title)+'">'+
    '<div class="drag"><div class="grab" aria-hidden="true"></div><div class="sh"><button class="btn text" onclick="closeSheet()">Cancel</button><h2>'+esc(o.title)+'</h2><span style="min-width:72px"></span></div></div>'+
    '<div class="sb">'+o.body+'</div>'+(o.foot?'<div class="sf">'+o.foot+'</div>':'')+'</div>';
  sheetOpen=true; document.body.style.overflow="hidden";
  /* swipe down on the grabber or title bar to dismiss, as on iOS */
  var sh=root.querySelector(".sheet"), dg=root.querySelector(".drag"), y0=null, dy=0;
  dg.addEventListener("pointerdown",function(e){ if(e.target.closest("button")) return; y0=e.clientY; dy=0; sh.classList.add("dragging"); dg.setPointerCapture(e.pointerId); });
  dg.addEventListener("pointermove",function(e){ if(y0===null) return; dy=Math.max(0,e.clientY-y0); sh.style.transform="translateY("+dy+"px)"; });
  function end(){ if(y0===null) return; y0=null; sh.classList.remove("dragging"); sh.style.transform=""; if(dy>110) closeSheet(); }
  dg.addEventListener("pointerup",end); dg.addEventListener("pointercancel",end);
  requestAnimationFrame(function(){ requestAnimationFrame(function(){ root.querySelector(".scrim").classList.add("show"); root.querySelector(".sheet").classList.add("show"); }); });
}
function closeSheet(instant){
  var root=document.getElementById("sheetRoot"); if(!sheetOpen) return;
  sheetOpen=false; document.body.style.overflow="";
  if(SYNC.needRender) setTimeout(softRender,300);
  var s=root.querySelector(".sheet"), sc=root.querySelector(".scrim");
  if(instant||!s){ root.innerHTML=""; return; }
  s.classList.remove("show"); sc.classList.remove("show"); setTimeout(function(){ if(!sheetOpen) root.innerHTML=""; },260);
}
document.addEventListener("keydown",function(e){ if(e.key==="Escape"&&sheetOpen) closeSheet(); });
var toastT=null;
function toast(msg,undo){
  var t=document.getElementById("toast");
  t.innerHTML='<span>'+esc(msg)+'</span>'+(undo?'<button id="toastUndo">Undo</button>':'');
  if(undo) document.getElementById("toastUndo").onclick=function(){ undo(); t.classList.remove("show"); };
  t.classList.add("show"); clearTimeout(toastT); toastT=setTimeout(function(){ t.classList.remove("show"); },undo?5000:2600);
}

save(); render(); syncStart();
</script>
